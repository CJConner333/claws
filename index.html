<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

        font-family: "gistesy";
        src: url("/fonts/gistesy.ttf") format("ttf");

        font-style: normal;
      }

  body {
    font-family: "gistesy", sans-serif;

<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">

  <title>Claws Nail and Supply</title>

  <section id="landing">
    <nav>

            <div class="nav__logo--title">Claws</div>
        </div>
      </div>

      <div class="nav__links">
        <a href="#manicure" class="nav__link">Manicure Products</a>
        <a href="#pedicure" class="nav__link">Pedicure Products</a>
        <a href="#support" class="nav__link">Customer Support</a>
      </div>

      <button class="btn__menu" onclick="openMenu()">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"    fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="btn__menu--svg">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </nav>
       <div class="modal">
            <button class="btn__menu btn__menu--close" onclick="closeMenu()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="light___StyledCloseIcon-lj69nl-14 fASujC">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="modal__links">
                <a class="modal__link">Manicure Products</a>
                <a class="modal__link">Pedicure Products</a>
                <a class="modal__link">Contact Support</a>
                <a class="modal__link"><a href="tel:+1-620-556-2457">620-556-2457</a>
            </div>
        </div>

        <header>
            <div class="container">
              <div class="row">
                <div class="header">
                    <p>114 Gunsmoke St, Dodge City KS 67801</p> 
                    <div><a class="header__phone"> <a href="tel:+1-620-556-2457">620-556-2457</a>
                    </div>  
                </div>
              </div>
            </div>
        </header>
  </section>

<main>
  <div class="container">
    <div class="row">
      <div class="feature">
          <img src="/assets/vecteezy_vector-illustration-of-a-woman-s-hand-with-red-nails-on-a_14989598.svg">
      </div> 
      <div class="store__links">
        <a href="https://www.shopify.com/store/claws-nail-supply/manicure" class="photo__button">
          <img src="/assets/manicure.png" alt="Manicure Products">
        </a>
        <a href="https://www.shopify.com/store/claws-nail-supply/pedicure" class="photo__button">
          <img src="/assets/pedicure.png" alt="Manicure Products">
        </a>

    </div>
